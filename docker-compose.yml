version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trueroll}
      POSTGRES_USER: ${POSTGRES_USER:-trueroll_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trueroll_app_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trueroll_app}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trueroll_app}:${POSTGRES_PASSWORD:-trueroll_app_password}@db:5432/${POSTGRES_DB:-trueroll}
      TAMPER_DATABASE_URL: postgresql://${TAMPER_DB_USER:-trueroll_tamper}:${TAMPER_DB_PASSWORD:-trueroll_tamper_password}@db:5432/${POSTGRES_DB:-trueroll}
      DEMO_MODE: ${DEMO_MODE:-true}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      HMAC_KEY: ${HMAC_KEY:-change-me-hmac}
      ANOMALY_ENABLED: ${ANOMALY_ENABLED:-false}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      VAULT_DIR: /app/vault
    volumes:
      - ./vault:/app/vault
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python -m scripts.init_db && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
